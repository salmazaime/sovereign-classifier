{# app/templates/base.html #}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{% block title %}Sovereignty Compliance Platform{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/css/jsvectormap.min.css">
<link rel="stylesheet" href="/static/css/main.css">
{% block extra_head %}{% endblock %}
</head>
<body>

<div id="sidebar" style="display:none;">
  <div class="sidebar-brand">
    <img src="/static/img/atlas-cloud-logo.svg" alt="Atlas Cloud">
    <div><div class="brand-title">Sovereignty</div><div class="brand-sub">ATLAS CLOUD</div></div>
  </div>
  <nav id="main-nav"></nav>
  <div class="sidebar-footer" id="user-info"></div>
</div>

<div id="main-wrap">
  <div id="topbar" style="display:none;">
    <div class="topbar-title" id="page-title">Dashboard</div>
    <div class="topbar-actions">
      <span class="roles-pill" id="roles-pill"></span>
    </div>
  </div>
  <main>
    {% block content %}{% endblock %}
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/js/jsvectormap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/maps/world.js"></script>
<script src="/static/js/app.js"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
